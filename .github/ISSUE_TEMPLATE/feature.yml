name: Feature request
description: Suggest an idea or improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the README and Plan.md first — if an idea is already marked
        `planned` or post-MVP, it belongs in docs/backlog.md rather than a feature
        request.
  - type: dropdown
    id: repo
    attributes:
      label: Repository
      options:
        - contracts
        - sdk
        - api
        - web
        - .github
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? Who is it for?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: readme-impact
    attributes:
      label: README impact
      description: Which README sections describe this feature today, if any?
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a breaking change to contracts or the API
          required: false
